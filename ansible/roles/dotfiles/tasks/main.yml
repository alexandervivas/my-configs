- name: Copy .zshrc
  copy:
    src: .zshrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    backup: true

- name: Copy .p10k.zsh
  copy:
    src: .p10k.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.p10k.zsh"
    backup: true

- name: Template Adevinta .zshrc.local
  template:
    src: .zshrc.local.adevinta.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.local"
    backup: true
  when: install_sdkman is defined and install_sdkman

- name: Ensure Colima config directory exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.colima/default"
    state: directory
    mode: "0755"

- name: Template Colima config
  template:
    src: colima.yaml.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.colima/default/colima.yaml"
    backup: true

- name: Check if .zshrc.personal exists
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.personal"
  register: zshrc_personal

- name: Warn if .zshrc.personal is missing
  debug:
    msg: "WARNING: ~/.zshrc.personal does not exist. Create it to add personal customizations that won't be overwritten by Ansible."
  when: not zshrc_personal.stat.exists
